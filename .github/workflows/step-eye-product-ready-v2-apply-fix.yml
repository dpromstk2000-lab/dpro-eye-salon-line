name: STEP EYE PRODUCT READY V2 Apply FIX

on:
  push:
    paths:
      - '.github/workflows/step-eye-product-ready-v2-apply-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PRODUCT READY frontend bridge
        shell: python
        run: |
          from pathlib import Path
          import base64
          files = {
            "config.js": "",
            "staff-ipad-login.html": "",
            "business-calendar.html": "",
          }
          for name, value in files.items():
              Path(name).write_bytes(base64.b64decode(value))
              print("wrote", name)

      - name: Validate frontend files
        shell: bash
        run: |
          set -euo pipefail
          node --check config.js
          python - <<'PY2'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, subprocess
          class Parser(HTMLParser):
              pass
          for page in ["staff-ipad-login.html","business-calendar.html"]:
              text=Path(page).read_text(encoding="utf-8")
              p=Parser(); p.feed(text); p.close()
              scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",text,flags=re.S)
              inline=[s for s in scripts if s.strip()]
              if inline:
                  js=Path("/tmp")/(Path(page).stem+"-inline.js")
                  js.write_text("\n".join(inline),encoding="utf-8")
                  subprocess.run(["node","--check",str(js)],check=True)
              print(page,"HTML/JS PASS")
          PY2
          grep -F 'EYE-22-DPRO-NEXT-STANDARD-LOCK-20260723' config.js
          grep -F 'EYE-PR-EDGE-2.2-LIMITED-STAFF-20260822' config.js
          grep -F 'X-DPRO-LINE-ID-TOKEN' config.js
          grep -F 'staff-ipad-login.html' config.js
          grep -F 'business-calendar.html' config.js

      - name: Commit with rollback tag
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_SHA=$(git rev-parse HEAD)
          BACKUP_TAG="eye-product-ready-v2-backup-${GITHUB_RUN_ID}"
          if ! git rev-parse "$BACKUP_TAG" >/dev/null 2>&1; then
            git tag "$BACKUP_TAG" "$BEFORE_SHA"
            git push origin "$BACKUP_TAG"
          fi

          rm -f .github/workflows/step-eye-product-ready-v2-apply.yml .github/workflows/step-eye-product-ready-v2-apply-fix.yml
          git config user.name "DPRO PRODUCT READY EYE"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "EYE Product Ready V2 secure adapter bridge"
          git push origin HEAD:main
