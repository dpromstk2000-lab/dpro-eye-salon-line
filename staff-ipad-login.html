<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6F4C55">
<title>スタッフiPadログイン｜DPRO EYE SALON</title>
<script src="./config.js"></script>
<style>
:root{--bg:#F7F3EF;--surface:#fff;--soft:#F2EAE5;--accent:#A86F7D;--dark:#6F4C55;--text:#2F2B2C;--muted:#6E6567;--border:#DED1CA;--ok:#64745F;--ng:#A14E55;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 8% 0,#F2DFE2 0,transparent 25rem),var(--bg);color:var(--text);font-size:17px;line-height:1.65}
.card{width:min(560px,100%);padding:30px;border:1px solid var(--border);border-radius:22px;background:rgba(255,255,255,.98);box-shadow:0 15px 40px rgba(78,53,61,.10)}
.brand{margin:0 0 5px;color:var(--dark);font-size:13px;font-weight:900;letter-spacing:.12em}h1{margin:0;font-size:32px}.lead{color:var(--muted)}label{display:block;margin-top:14px;font-weight:850}input{width:100%;min-height:54px;margin-top:6px;padding:10px 13px;border:2px solid var(--border);border-radius:13px;font:inherit}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{min-height:52px;padding:10px 18px;border:0;border-radius:13px;font:inherit;font-weight:900;cursor:pointer}.primary{color:#fff;background:var(--accent)}.secondary{color:var(--dark);background:var(--soft)}.status{margin-top:14px;padding:13px 15px;border-radius:12px;background:var(--soft);color:var(--muted);font-weight:800}.status.ok{background:#E7EFE4;color:#40513B}.status.ng{background:#F7E6E7;color:#7E343A}.demo{margin-top:15px;padding:13px;border:1px solid #E5D09A;border-radius:12px;background:#FFF6E2;color:#725013;font-weight:750}small{display:block;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<main class="card">
<p class="brand">DPRO EYE SALON LINE</p>
<h1>スタッフiPadログイン</h1>
<p class="lead">スタッフごとの認証後、来店受付・施術進行・カルテ・施術写真だけを操作できます。店舗設定やスタッフ管理は開きません。</p>
<div id="demoBox" class="demo" hidden>DEMO：スタッフコード <b>staff02</b> ／ PIN <b>2345</b></div>
<label>スタッフコード<input id="staffCode" autocomplete="username" maxlength="80" placeholder="例：staff02"></label>
<label>スタッフPIN<input id="staffPin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="32" placeholder="PIN"></label>
<div class="row">
<button id="login" class="btn primary" type="button">店舗iPadを開く</button>
<button id="clear" class="btn secondary" type="button">認証情報を削除</button>
</div>
<div id="status" class="status">スタッフコードとPINを入力してください。</div>
<small>PINはブラウザへ保存しません。認証後のスタッフセッションだけをこのタブ内に保持します。</small>
</main>
<script>
(() => {
  "use strict";
  const config=window.DPRO_EYE_CONFIG;
  const params=new URLSearchParams(location.search);
  const isDemo=params.get("demo")==="1";
  const $=id=>document.getElementById(id);
  function status(text,mode=""){$("status").textContent=text;$("status").className=`status ${mode}`.trim()}
  async function login(){
    const staff_code=$("staffCode").value.trim();
    const pin=$("staffPin").value.trim();
    if(!staff_code||!pin)return status("スタッフコードとPINを入力してください。","ng");
    $("login").disabled=true;status("認証しています…");
    try{
      const res=await fetch(config.API.staff_login,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({staff_code,pin})});
      const data=await res.json().catch(()=>null);
      if(!res.ok||!data?.sessionToken)throw new Error(data?.message||"スタッフ認証に失敗しました。");
      sessionStorage.setItem(config.STORAGE_KEYS.staff_session,data.sessionToken);
      sessionStorage.setItem(config.STORAGE_KEYS.staff_session_expires,data.expiresAt||"");
      status(`${data.staff?.display_name||"スタッフ"}として認証しました。`,"ok");
      const next=new URL("./owner-ipad.html",location.href);
      next.searchParams.set("staff","1");
      if(isDemo)next.searchParams.set("demo","1");
      location.href=next.href;
    }catch(e){status(e.message||"スタッフ認証に失敗しました。","ng")}
    finally{$("login").disabled=false}
  }
  $("login").addEventListener("click",login);
  $("staffPin").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
  $("clear").addEventListener("click",()=>{
    sessionStorage.removeItem(config.STORAGE_KEYS.staff_session);
    sessionStorage.removeItem(config.STORAGE_KEYS.staff_session_expires);
    $("staffPin").value="";status("スタッフ認証情報を削除しました。","ok");
  });
  if(isDemo){$("demoBox").hidden=false;$("staffCode").value="staff02";$("staffPin").value="2345"}
})();
</script>
</body>
</html>
